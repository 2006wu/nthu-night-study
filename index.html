<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜讀空位 · 清大</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/frog.js" defer></script></head>
<body><main>
<header><a class="brand" href="/" aria-label="首頁"><span class="brand-icon">☾</span> 夜讀空位</a><span id="connection" class="status">尚未登入</span></header>
<section class="search-panel" aria-label="查詢條件"><div class="search-main"><label>開始日期<input id="date" type="date" required></label><label>開始時間<select id="time" aria-label="開始時間"></select></label><button id="search" class="primary">查看空位 <span>↗</span></button></div></section>
<details id="loginPanel" class="login-panel" open><summary><span>登入</span></summary><div class="login-inner"><form id="loginForm" method="post" action="/api/login" autocomplete="on"><div class="credentials"><label>帳號<input id="account" name="username" autocomplete="username" required placeholder="學號／借書證號"></label><label>密碼<input id="password" name="password" type="password" autocomplete="current-password" required placeholder="輸入密碼"></label></div><div class="captcha-row"><div class="captcha-image"><img id="captchaImage" alt="官方登入驗證碼" hidden><span id="captchaPlaceholder">驗證碼</span></div><button id="refresh" type="button" class="secondary">更新圖片</button><label>驗證碼<input id="captcha" autocomplete="off" maxlength="4" placeholder="4 個字元"></label></div><div class="remember-row"><label class="check"><input id="rememberAccount" type="checkbox">記住帳號</label><label id="rememberPasswordOption" class="check" hidden><input id="rememberPassword" type="checkbox">由瀏覽器儲存密碼</label></div><div class="login-actions"><button id="manualLogin" class="primary" type="submit">登入</button><button id="logout" type="button" class="text-button" hidden>登出</button></div></form></div></details>
<div id="notice" class="notice" role="status" hidden></div>
<details id="myReservations" class="login-panel"><summary><span>我的預約</span></summary><div class="reservations-inner"><button id="refreshReservations" class="secondary" type="button">更新</button><div id="reservationList" class="reservation-list"></div></div></details>
<section class="results-section" aria-label="座位結果"><div class="result-heading"><div><h2 id="resultTitle">座位</h2><p id="resultMeta" class="muted"></p></div><a href="https://libsms.lib.nthu.edu.tw/build/redirect_to/appointment" target="_blank" rel="noopener noreferrer" class="official-link">官方預約 ↗</a></div>
<div class="filters"><div id="zones" class="zone-buttons" role="group" aria-label="分區篩選"><button data-zone="all" aria-pressed="true">全部</button><button data-zone="A" aria-pressed="false">A 區</button><button data-zone="B" aria-pressed="false">B 區</button><button data-zone="C" aria-pressed="false">C 區</button><button data-zone="D" aria-pressed="false">D 區</button><button data-zone="E" aria-pressed="false">E 區</button></div><label class="compact">至少可坐<select id="minDuration"><option value="0">不限</option><option value="60">1 小時</option><option value="120">2 小時</option><option value="240">4 小時</option><option value="480">8 小時</option></select></label><label class="check"><input id="includeLater" type="checkbox">晚點有位</label><label class="check"><input id="favoriteOnly" type="checkbox">收藏</label></div>
<p id="aCurrent" class="a-current" hidden></p><div id="results" class="seat-grid"><div class="empty">選擇時間後查詢</div></div>
</section>
</main><dialog id="bookingDialog" aria-labelledby="bookingTitle"><div class="booking-header"><h2 id="bookingTitle">預約座位</h2><button id="bookingClose" class="text-button" aria-label="關閉預約">✕</button></div><p id="bookingSeat"></p><div id="bookingSelection"><p id="bookingStart" class="muted"></p><label>結束時間<select id="bookingEnd"></select></label></div><p id="bookingReview" hidden></p><p id="bookingError" class="booking-error" role="status" hidden></p><div class="booking-actions"><button id="bookingBack" class="secondary" hidden>修改時間</button><button id="bookingNext" class="primary">下一步</button><button id="bookingConfirm" class="primary" hidden>確認預約</button></div><a class="booking-official" href="https://libsms.lib.nthu.edu.tw/build/redirect_to/info" target="_blank" rel="noopener noreferrer">官方預約現況 ↗</a></dialog><dialog id="cancelDialog" aria-labelledby="cancelTitle"><div class="booking-header"><h2 id="cancelTitle">取消預約？</h2><button id="cancelClose" class="text-button" aria-label="關閉取消預約">✕</button></div><p id="cancelSeat"></p><p id="cancelTime"></p><p id="cancelError" class="booking-error" role="status" hidden></p><div class="booking-actions"><button id="cancelKeep" class="secondary">保留預約</button><button id="cancelConfirm" class="danger-button">確認取消</button></div><a class="booking-official" href="https://libsms.lib.nthu.edu.tw/build/redirect_to/info" target="_blank" rel="noopener noreferrer">官方預約現況 ↗</a></dialog><dialog id="weeklyDialog" aria-labelledby="weeklyTitle"><div class="booking-header"><h2 id="weeklyTitle">小蛙幫你約一週</h2><button id="weeklyClose" class="text-button" aria-label="關閉七天預約">✕</button></div><p class="muted">登入當天起七天 · 21:00～隔日 00:00</p><p id="weeklySummary" class="muted">優先固定座位</p><div id="weeklyDays"></div><p id="weeklyError" class="booking-error" role="status" hidden></p><div class="booking-actions"><button id="weeklyPreview" class="secondary">查看安排</button><button id="weeklyConfirm" class="primary" hidden>確認預約</button></div><a class="booking-official" href="https://libsms.lib.nthu.edu.tw/build/redirect_to/info" target="_blank" rel="noopener noreferrer">官方預約現況 ↗</a></dialog><aside class="frog-helper" aria-label="青蛙小幫手"><section id="frogPanel" class="frog-panel" aria-labelledby="frogTitle" hidden><div class="frog-heading"><strong id="frogTitle">小蛙</strong><button id="frogClose" type="button" aria-label="收合小幫手">×</button></div><p id="frogMessage" aria-live="polite">呱～先登入，再來找位子。</p><div class="frog-actions"><button id="frogAction" type="button">前往登入</button><button id="frogWeekly" type="button">約一週</button><button id="frogBookings" type="button">我的預約</button></div></section><p id="frogCheer" class="frog-cheer" role="status" hidden></p><button id="frogToggle" class="frog-toggle" type="button" aria-label="青蛙小幫手" aria-expanded="false" aria-controls="frogPanel"><svg viewBox="0 0 80 72" aria-hidden="true" focusable="false"><ellipse cx="40" cy="61" rx="33" ry="8" fill="#b8d9a3"/><path d="M9 44C9 25 22 19 40 19S71 25 71 44C71 60 58 63 40 63S9 60 9 44Z" fill="#8ebc6c" stroke="#345e42" stroke-width="2.5"/><circle cx="23" cy="22" r="14" fill="#8ebc6c" stroke="#345e42" stroke-width="2.5"/><circle cx="57" cy="22" r="14" fill="#8ebc6c" stroke="#345e42" stroke-width="2.5"/><g class="frog-eyes"><circle cx="23" cy="22" r="8.5" fill="#fffdf0"/><circle cx="57" cy="22" r="8.5" fill="#fffdf0"/><ellipse cx="25" cy="23" rx="3.5" ry="5" fill="#284735"/><ellipse cx="55" cy="23" rx="3.5" ry="5" fill="#284735"/></g><ellipse cx="19" cy="43" rx="7" ry="3.5" fill="#e5aa90" opacity=".8"/><ellipse cx="61" cy="43" rx="7" ry="3.5" fill="#e5aa90" opacity=".8"/><path d="M29 44Q40 55 51 44" fill="none" stroke="#345e42" stroke-width="2.5" stroke-linecap="round"/><circle cx="35" cy="36" r="1.4" fill="#345e42"/><circle cx="45" cy="36" r="1.4" fill="#345e42"/></svg></button></aside></body></html>
