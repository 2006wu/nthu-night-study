<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜讀空位 · 清大</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main>
<header><a class="brand" href="/" aria-label="首頁"><span class="brand-icon">☾</span> 夜讀空位</a><span id="connection" class="status">尚未登入</span></header>
<section class="search-panel" aria-label="查詢條件"><div class="search-main"><label>開始日期<input id="date" type="date" required></label><label>開始時間<select id="time" aria-label="開始時間"></select></label><button id="search" class="primary">查看空位 <span>↗</span></button></div></section>
<details id="loginPanel" class="login-panel" open><summary><span>登入</span></summary><div class="login-inner"><form id="loginForm"><div class="credentials"><label>帳號<input id="account" autocomplete="username" required placeholder="學號／借書證號"></label><label>密碼<input id="password" type="password" autocomplete="current-password" required placeholder="輸入密碼"></label></div><div class="captcha-row"><div class="captcha-image"><img id="captchaImage" alt="官方登入驗證碼" hidden><span id="captchaPlaceholder">驗證碼</span></div><button id="refresh" type="button" class="secondary">更新圖片</button><label>驗證碼<input id="captcha" autocomplete="off" maxlength="4" placeholder="4 個字元"></label></div><div class="login-actions"><button id="manualLogin" class="primary" type="submit">登入</button><button id="logout" type="button" class="text-button" hidden>登出</button></div></form></div></details>
<div id="notice" class="notice" role="status" hidden></div>
<details id="myReservations" class="login-panel"><summary><span>我的預約</span></summary><div class="reservations-inner"><button id="refreshReservations" class="secondary" type="button">更新</button><div id="reservationList" class="reservation-list"></div></div></details>
<section class="results-section" aria-label="座位結果"><div class="result-heading"><div><h2 id="resultTitle">座位</h2><p id="resultMeta" class="muted"></p></div><a href="https://libsms.lib.nthu.edu.tw/build/redirect_to/appointment" target="_blank" rel="noopener noreferrer" class="official-link">官方預約 ↗</a></div>
<div class="filters"><div id="zones" class="zone-buttons" role="group" aria-label="分區篩選"><button data-zone="all" aria-pressed="true">全部</button><button data-zone="B" aria-pressed="false">B 區</button><button data-zone="C" aria-pressed="false">C 區</button><button data-zone="D" aria-pressed="false">D 區</button><button data-zone="E" aria-pressed="false">E 區</button></div><label class="compact">至少可坐<select id="minDuration"><option value="0">不限</option><option value="60">1 小時</option><option value="120">2 小時</option><option value="240">4 小時</option><option value="480">8 小時</option></select></label><label class="check"><input id="includeLater" type="checkbox">晚點有位</label><label class="check"><input id="favoriteOnly" type="checkbox">收藏</label></div>
<div id="results" class="seat-grid"><div class="empty">選擇時間後查詢</div></div>
</section>
</main><dialog id="bookingDialog" aria-labelledby="bookingTitle"><div class="booking-header"><h2 id="bookingTitle">預約座位</h2><button id="bookingClose" class="text-button" aria-label="關閉預約">✕</button></div><p id="bookingSeat"></p><div id="bookingSelection"><p id="bookingStart" class="muted"></p><label>結束時間<select id="bookingEnd"></select></label></div><p id="bookingReview" hidden></p><p id="bookingError" class="booking-error" role="status" hidden></p><div class="booking-actions"><button id="bookingBack" class="secondary" hidden>修改時間</button><button id="bookingNext" class="primary">下一步</button><button id="bookingConfirm" class="primary" hidden>確認預約</button></div><a class="booking-official" href="https://libsms.lib.nthu.edu.tw/build/redirect_to/info" target="_blank" rel="noopener noreferrer">官方預約現況 ↗</a></dialog><dialog id="cancelDialog" aria-labelledby="cancelTitle"><div class="booking-header"><h2 id="cancelTitle">取消預約？</h2><button id="cancelClose" class="text-button" aria-label="關閉取消預約">✕</button></div><p id="cancelSeat"></p><p id="cancelTime"></p><p id="cancelError" class="booking-error" role="status" hidden></p><div class="booking-actions"><button id="cancelKeep" class="secondary">保留預約</button><button id="cancelConfirm" class="danger-button">確認取消</button></div><a class="booking-official" href="https://libsms.lib.nthu.edu.tw/build/redirect_to/info" target="_blank" rel="noopener noreferrer">官方預約現況 ↗</a></dialog></body></html>
